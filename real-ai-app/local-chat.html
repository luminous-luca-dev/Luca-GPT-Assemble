<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#292536">
    <title>Chat-NGT - ローカルチャット</title>
    <link rel="stylesheet" href="/local-chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <main id="chat-app">
        <header id="chat-header">
            <button id="room-menu-button" type="button" aria-label="トークルーム一覧を開く"
                aria-haspopup="dialog" aria-controls="room-dialog">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
            <div class="header-info">
                <span class="avatar" aria-hidden="true">N</span>
                <div class="header-copy">
                    <h1 id="room-name" class="room-name">Chat-NGT</h1>
                    <p id="model-status" role="status">ローカルモデルに接続中...</p>
                </div>
            </div>
            <button id="settings-button" type="button" aria-label="設定を開く"
                aria-haspopup="dialog" aria-controls="settings-dialog">
                <i class="fa-solid fa-gear" aria-hidden="true"></i>
            </button>
        </header>

        <section id="chat-timeline" aria-label="チャット履歴" aria-live="polite">
            <div class="msg-row luca">
                <div class="msg-bubble">こんにちは！学習したモデルとローカルで会話できます。</div>
            </div>
        </section>

        <div id="chat-error" class="chat-error hidden" role="alert"></div>
        <footer id="chat-footer">
            <form id="message-form" class="input-container">
                <textarea id="message-input" rows="1" maxlength="4000"
                    placeholder="メッセージを入力..." aria-label="メッセージを入力"></textarea>
                <button id="send-btn" type="submit" aria-label="送信" disabled>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
            <p class="footer-note">より性能を上げるため会話は保存されます</p>
        </footer>
    </main>
    <dialog id="room-dialog" aria-labelledby="room-dialog-title">
        <div class="room-dialog-header">
            <h2 id="room-dialog-title">トークルーム</h2>
            <button id="room-dialog-close" type="button" aria-label="トークルーム一覧を閉じる">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        <button id="new-room-button" type="button">
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
            新しいチャット
        </button>
        <nav id="room-list" aria-label="トークルーム一覧"></nav>
    </dialog>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
        <div class="settings-header">
            <h2 id="settings-title">設定</h2>
            <button id="settings-close" type="button" aria-label="設定を閉じる">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        <div class="settings-content">
            <div class="settings-field">
                <label for="model-select">使用モデル</label>
                <select id="model-select" disabled>
                    <option>モデルを読み込み中...</option>
                </select>
                <small class="settings-help">切り替えたモデルは、このサーバーの全接続で使用されます。</small>
            </div>
            <label class="context-setting" for="context-toggle">
                <span class="context-copy">
                    <span class="settings-label">過去の会話を参照する</span>
                    <small>オフの場合、今回の質問だけで回答します。この設定はこのブラウザーに保存されます。</small>
                </span>
                <input id="context-toggle" type="checkbox" disabled>
            </label>
            <p id="settings-status" role="status">設定を読み込み中...</p>
            <div class="settings-footer">
                <span class="local-badge"><i class="fa-solid fa-desktop" aria-hidden="true"></i> LOCAL</span>
            </div>
        </div>
    </dialog>
    <script src="/local-chat.js"></script>
</body>
</html>
